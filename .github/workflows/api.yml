name: Deploy API (Cloud Run)

# The frontend fixtures are recorded from the engine and checked by
# api/tests/test_frontend_fixtures.py, so a change to them runs the tests too.
# Only an api/** or workflow change deploys (the `changes` job below).
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
      - "frontend/src/world/__fixtures__/**"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
      - "frontend/src/world/__fixtures__/**"

env:
  GCP_PROJECT: hex-general
  GCP_REGION: us-central1
  AR_REPO: hex
  SERVICE: hex-api
  RUNTIME_SA: hex-api-runtime@hex-general.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run black --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -q

  # Did this push touch the API itself? A fixtures-only push runs the tests
  # but must not redeploy. If the previous head can't be fetched (a force
  # push), assume it did: an extra deploy is harmless, a skipped one is not.
  changes:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git fetch --no-tags --depth=1 origin "$BEFORE" \
            && git diff --quiet "$BEFORE" HEAD -- api .github/workflows/api.yml; then
            echo "api=false" >> "$GITHUB_OUTPUT"
          else
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, changes]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build & push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t "$IMAGE" api
          docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --service-account "$RUNTIME_SA" \
            --set-env-vars "^|^SUPABASE_URL=https://amhkpsrvjlthmmemwssc.supabase.co|DEV_USER_IDS=1d151034-f72a-44a3-ab37-bdcac928edb0|CLOCK_AUDIENCE=https://hex-api-qfzj5tg56a-uc.a.run.app|CLOCK_INVOKER_EMAIL=hex-clock@hex-general.iam.gserviceaccount.com" \
            --update-secrets "SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest"
