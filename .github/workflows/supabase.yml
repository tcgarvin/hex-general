name: Migrate Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: amhkpsrvjlthmmemwssc
    steps:
      - uses: actions/checkout@v4
      # Pinned to the CLI the local stack runs (`supabase --version`), so the
      # remote push uses the same migration tooling we tested with. Bump both
      # together.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      # config.toml sets [auth].signing_keys_path for the local stack, and the
      # CLI parses the whole config (failing if the file is missing) even though
      # `db push` only pushes migrations and never uses auth signing keys. The
      # real key is local-only and gitignored, so generate a throwaway one here
      # purely to satisfy the parser. It is never pushed anywhere.
      - name: Generate throwaway signing key (config parse only)
        run: |
          echo '[]' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --append
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Push migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
