[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hex-general-api"
version = "0.1.0"
description = "Hex Wargame deterministic execution engine (Cloud Run API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "supabase>=2.7",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "mypy>=1.11",
    "black>=24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The full statistical arena gates (AI_SPEC §7.3) are slow (90 games on the
# 40x40 map); they run only via `uv run pytest -m arena` or the arena CLI. The
# default suite (and CI) runs the fast smoke subset in tests/ai/test_gates.py.
markers = [
    "arena: full statistical acceptance gates (slow; run with -m arena)",
]
addopts = "-m 'not arena'"
